[package]
name = "switchboard-chat"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "SMS (voip.ms) and web chat to Matrix bridge for helplines"
publish = false

[profile.release]
debug = "line-tables-only"

[dependencies]
anyhow = "1.0.98"
matrix-sdk = "0.19.1"
unicode-normalization = "0.1"
tokio = { version = "1.43.1", default-features = false, features = ["full","sync","macros", "rt-multi-thread"]}
tracing-subscriber =   {version = "0.3.18", features= ["env-filter"] }
dirs = "6.0.0"
serde = { version = "1.0.217", features = ["rc","derive"] }
serde_json = "1.0.138"
rand = "0.8.5"
tower-http = {version = "0.6.6", features = ["trace", "cors", "timeout"] }
tower = { version = "0.5", features = ["limit"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tokio-rustls = "0.26.2"
axum = "0.7"
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
rusqlite = "0.40.0"
url = "2.5.4"
chrono = "0.4.41"
tracing-appender = "0.2.3"
tracing = "0.1.41"
regex = "1.11.1"
tokio-stream = { version = "0.1.17", features = ["sync"] }
futures-util = "0.3.31"
tokio_schedule = "0.3.2"
chrono-tz = "0.10.4"
sha2 = "0.10"
email_address = "0.2.9"
dotenvy = "0.15"
aes-gcm = "0.10"
ipnet = "2"
