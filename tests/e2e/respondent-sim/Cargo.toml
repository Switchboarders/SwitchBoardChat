[package]
name = "respondent-sim"
version = "0.1.0"
edition = "2021"
description = "A scriptable Matrix respondent (one device) for the end-to-end tests"

[workspace]

[dependencies]
matrix-sdk = "0.19.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
