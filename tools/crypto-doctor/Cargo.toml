[package]
name = "crypto-doctor"
version = "0.1.0"
edition = "2021"
description = "Offline inspection and repair of the bridge's Matrix encryption store (see docs/encryption-recovery.md)"

# Standalone crate: it is not part of the bridge build.
[workspace]

[dependencies]
matrix-sdk-sqlite = { version = "0.19", features = ["crypto-store"] }
matrix-sdk-crypto = "0.19"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
