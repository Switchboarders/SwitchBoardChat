# cargo deny check  (advisories, licenses, bans, sources)

[graph]
all-features = false

[advisories]
# Every ignored advisory must say why it does not apply
ignore = [
    # SQLite bundled source in libsqlite3-sys < 0.39. This project does not enable the `bundled`
    # feature: it links the system SQLite (Debian's libsqlite3-0 in the image), so the bundled copy is
    # never compiled. matrix-sdk-sqlite 0.19 pins rusqlite 0.40 / libsqlite3-sys 0.38.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite not compiled; system libsqlite3 is used" },
    # Unmaintained crates pulled in by matrix-sdk / axum-server, no fixed version available
    { id = "RUSTSEC-2026-0319", reason = "anymap2 unmaintained, transitive (matrix-sdk)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained, transitive (axum-server 0.7)" },
]

[licenses]
# Permissive and weak-copyleft (file-level) licenses only; no GPL/AGPL
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# This crate itself: source-available, non-commercial (LICENSE)
exceptions = [
    { allow = ["PolyForm-Noncommercial-1.0.0"], crate = "switchboard-chat" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
